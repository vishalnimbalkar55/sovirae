[package]
name = "sovirae-pocket-worker"  # Activity Monitor shows the executable name
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated Pocket TTS (Kyutai) inference process"

[dependencies]
serde.workspace = true
serde_json.workspace = true
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Apple's BLAS for the matrix products; the model runs on the CPU.
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }
