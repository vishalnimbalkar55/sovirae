[package]
name = "sovirae"  # Activity Monitor shows the executable name
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local text-to-speech with a floating player"

[lib]
name = "speakit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
arboard = "3.6"
speakit-core.workspace = true
speakit-audio.workspace = true
speakit-tts.workspace = true
speakit-models.workspace = true
speakit-protocol.workspace = true
libc = "0.2"

[dev-dependencies]
speakit-models.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
# AF_UNIX sockets for the Chrome bridge (Windows 10 1803+).
uds_windows = "1.1"
# Same version Tauri uses, so HWND types match.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
