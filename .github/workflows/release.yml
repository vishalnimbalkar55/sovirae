# Builds the macOS DMG and the Windows installer on GitHub's runners and
# attaches them, with the Chrome extension zip, to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0     builds and publishes the release
#   Actions › Release › Run workflow             builds only; downloads under Artifacts
#
# The tag must match the version in src-tauri/tauri.conf.json. Builds are
# unsigned (ad-hoc on macOS), so macOS and Windows warn on first launch; the
# release notes say how to open them.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gpu:
        description: "Include the NVIDIA CUDA libraries in the Windows build (adds about 1.3 GB)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install espeak-ng (Kokoro pronunciation, used by the tests)
        run: brew install espeak-ng
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match the version $version in src-tauri/tauri.conf.json." >&2
            exit 1
          fi
      - name: Test and build
        run: npm run build:all -- --mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/macos/*.dmg
            build/macos/*_macos.zip
            build/*_chrome-extension.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match the version $version in src-tauri/tauri.conf.json." >&2
            exit 1
          fi
      - name: Download the NVIDIA CUDA libraries
        if: github.event.inputs.gpu == 'true'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          cargo build --release -p sovirae-kokoro-worker
          npm run fetch:cuda
      - name: Build the installer and portable zip
        shell: bash
        # Tests run in the macOS job; the Windows build is kept short. The
        # CUDA libraries are bundled only when the step above fetched them.
        run: npm run build:all -- --windows --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            build/windows/*-setup.exe
            build/windows/*-portable.zip

  release:
    name: Publish the GitHub Release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Sovirae ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads

            | File | For |
            |---|---|
            | `Sovirae_<version>_aarch64.dmg` | macOS 13 or later on Apple Silicon. Drag Sovirae to Applications. |
            | `Sovirae_<version>_x64-setup.exe` | Windows 10 (1803+) or 11, 64-bit. Installs for the current user. |
            | `Sovirae_<version>_x64-portable.zip` | Windows, no installation: unzip and run `Sovirae.exe`. |
            | `Sovirae_<version>_chrome-extension.zip` | The Chrome extension, for *Load unpacked* (the app also carries a copy). |

            ## First launch

            These builds are not signed with a developer certificate, so each system warns once.

            - **macOS:** if it says Sovirae cannot be opened or could not be verified, open *System Settings › Privacy & Security*, scroll down, and choose **Open Anyway**. Then open it again.
            - **Windows:** on the SmartScreen notice, choose **More info**, then **Run anyway**.

            Kokoro voices on macOS need `espeak-ng` (`brew install espeak-ng`); on Windows it is included. Neural voices are downloaded inside the app under Voices.
